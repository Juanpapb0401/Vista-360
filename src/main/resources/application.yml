spring:
  application:
    name: servicio-academico

  datasource:
    # H2 en memoria para esta prueba técnica y para desarrollo local, en modo
    # de compatibilidad PostgreSQL. En producción se reemplaza por PostgreSQL
    # real; ver docs/03-modelo-datos.md.
    url: jdbc:h2:mem:academico;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    # El esquema lo controla Flyway (src/main/resources/db/migration), no Hibernate.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # Solo health. Los demás endpoints del actuator exponen información
        # operativa (configuración, métricas, beans) que no hay razón para
        # publicar en un servicio con datos académicos.
        include: health

app:
  security:
    # public-key-path: en un ambiente real, apunta a la llave pública de la
    # plataforma de identidad (ej. file:/etc/vista360/idp-public.pem). Sin
    # configurar, el servicio genera un par de llaves RSA efímero en memoria,
    # pensado solo para desarrollo y pruebas (ver LlavesRsaConfig).
    issuer: vista360-dev-issuer
    audience: servicio-academico

---
# Perfil "dev": habilita el emisor de tokens de prueba (DevTokenController)
# y la consola web de H2, para poder explorar el servicio de punta a punta
# sin depender de una plataforma de identidad real. Se activa con
# --spring.profiles.active=dev (ver README.md).
spring:
  config:
    activate:
      on-profile: dev
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    show-sql: true
  flyway:
    # Los datos ficticios de demostración solo existen en desarrollo; en
    # cualquier otro ambiente Flyway aplica únicamente el esquema.
    locations: classpath:db/migration,classpath:db/testdata

logging:
  level:
    com.vista360.academico: DEBUG
